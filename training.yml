name: training
root: .

windows:
  - RegNetY:
      - python train_baseline.py --model RegNetY_400MF \
            --data-folder ./data \
            --batch_size 64 \
            --epochs 240 \
            --learning_rate 0.1 \
            --checkpoint-dir ./output-new-baseline-4090

  - RegNetX:
      - python train_baseline.py --model RegNetX_400MF \
            --data-folder ./data \
            --batch_size 64 \
            --epochs 240 \
            --learning_rate 0.1 \
            --checkpoint-dir ./output-new-baseline-4090

  - ResNet:
      - python train_baseline.py --model resnet32x4 \
            --data-folder ./data \
            --batch_size 64 \
            --epochs 240 \
            --learning_rate 0.1 \
            --checkpoint-dir ./output-new-baseline-4090

  - WRN:
      - python train_baseline.py --model wrn_28_4 \
            --data-folder ./data \
            --batch_size 64 \
            --epochs 240 \
            --learning_rate 0.1 \
            --checkpoint-dir ./output-new-baseline-4090 
